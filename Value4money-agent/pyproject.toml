[project]
name = "value4money-agent"
version = "0.1.0"
description = "A LangGraph agent that turns a public tender and its bids into a sourced evidence file for a human committee, comparing bid totals against past public awards in Postgres."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Deo Siatah" },
    { name = "Geoffrey Muriuki" },
]
dependencies = [
    "pandas",
    "psycopg[binary]",
    "ftfy",
    "python-dotenv",
    "mcp",
    "pypdf",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langchain-mcp-adapters",
    "langchain-ollama",
    "langchain-groq",
    "rich",
    "langgraph-checkpoint-postgres",
    "opik>=2.2.100",
]

[dependency-groups]
dev = [
    "pytest",
    "fpdf2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
